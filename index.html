<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>sentiments — creative outreach</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Sono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-left">sentiments</div>
    <div class="nav-right">
      <a href="#">Services</a>
      <a href="#">Client Work</a>
      <a href="#">Contact</a>
      <button class="nav-menu-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false">
        Menu
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="mobile-menu" hidden>
    <a href="#">Services</a>
    <a href="#">Client Work</a>
    <a href="#">Contact</a>
  </div>

  <!-- Hero -->
  <section class="hero">
    <!-- animated gradient background lives here -->
    <div class="hero-3d" aria-hidden="true"></div>

   

    <div class="hero-stack">
      <h1 class="hero-title"><span class="title-gradient">sentiments</span></h1>
    </div>

    <div class="hero-buttons">
      <a href="#" class="btn btn-gradient">See what we do ↲</a>
      <p class="hero-subtitle">
        We craft bold, minimal campaigns that resonate deeply. (Placeholder text)
      </p>
    </div>

    

    <div class="scroll-indicator">
      <span class="asterisk-left">*</span>
      <span class="scroll-text">Scroll to explore</span>
      <span class="asterisk-right">*</span>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-left">sentiments</div>
    <div class="footer-center"></div>
    <div class="footer-right">
      <span id="datetime"></span>
    </div>
  </footer>

  <!-- Existing utilities -->
  <script src="js/datetime.js" defer></script>
  <script src="js/noise.js" defer></script>
  <script src="js/menu.js" defer></script>

  <!-- New lightweight gradient animator -->
  <script src="js/gradient-hero.js" defer></script>

</html>
